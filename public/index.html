<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livis Codex Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d10; color: #f1f3f5; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { color: #7dd3fc; font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; font-size: clamp(27px, 4vw, 42px); letter-spacing: -.04em; }
    .sub { color: #9198a1; margin: 0; font-size: 14px; }
    .connection { display: flex; align-items: center; gap: 9px; border: 1px solid #262b31; border-radius: 999px; padding: 9px 13px; background: #12151a; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 4px #f59e0b22; }
    .dot.online { background: #34d399; box-shadow: 0 0 0 4px #34d39922; }
    .dot.offline { background: #fb7185; box-shadow: 0 0 0 4px #fb718522; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .card, .panel { border: 1px solid #242930; background: linear-gradient(145deg, #14181d, #101318); border-radius: 16px; }
    .card { padding: 18px; min-height: 112px; }
    .label { color: #838b95; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .value { margin-top: 12px; font-size: 28px; font-weight: 760; letter-spacing: -.03em; }
    .value.small { font-size: 18px; margin-top: 17px; }
    .panel { overflow: hidden; }
    .panel + .panel { margin-top: 18px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; border-bottom: 1px solid #242930; }
    h2 { margin: 0; font-size: 16px; }
    #updated { color: #747c86; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 20px; text-align: left; border-bottom: 1px solid #20252b; font-size: 13px; vertical-align: top; }
    th { color: #757e88; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; color: #a8b1bb; }
    .status { display: inline-flex; align-items: center; border: 1px solid #343a43; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .status.running { color: #7dd3fc; border-color: #0c4a6e; background: #082f4938; }
    .status.queued, .status.ready { color: #fcd34d; border-color: #854d0e; background: #713f1238; }
    .status.completed { color: #6ee7b7; border-color: #065f46; background: #064e3b38; }
    .status.interrupted, .status.failed { color: #fda4af; border-color: #881337; background: #4c051938; }
    .preview { color: #bdc3ca; max-width: 520px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .threads-list { display: grid; gap: 12px; padding: 16px; }
    .thread { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(190px, .8fr); gap: 18px; border: 1px solid #272d35; border-radius: 12px; background: #0d1014; padding: 16px; }
    .thread-title { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
    .thread-input { color: #d9dde2; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .thread-meta { color: #858e99; font-size: 12px; line-height: 1.65; }
    .activity { color: #7dd3fc; margin-bottom: 4px; font-size: 13px; font-weight: 650; }
    .empty { color: #747c86; padding: 42px 20px; text-align: center; }
    .error { display: none; margin-bottom: 14px; border: 1px solid #7f1d1d; background: #450a0a66; color: #fecaca; border-radius: 12px; padding: 12px 14px; font-size: 13px; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } header { display: block; } .connection { width: fit-content; margin-top: 18px; } .thread { grid-template-columns: 1fr; } th:nth-child(5), td:nth-child(5) { display: none; } }
    @media (max-width: 520px) { main { width: min(100% - 20px, 1180px); padding-top: 22px; } .grid { grid-template-columns: 1fr 1fr; } .card { padding: 14px; min-height: 96px; } .value { font-size: 22px; } th, td { padding: 12px; } th:nth-child(6), td:nth-child(6) { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Local Operations</div>
        <h1>Livis Codex Console</h1>
        <p class="sub" id="agent">正在读取本地网关…</p>
      </div>
      <div class="connection"><span class="dot" id="dot"></span><span id="connection-text">连接中</span></div>
    </header>
    <div class="error" id="error"></div>
    <section class="grid">
      <article class="card"><div class="label">运行中</div><div class="value" id="running">–</div></article>
      <article class="card"><div class="label">已完成</div><div class="value" id="completed">–</div></article>
      <article class="card"><div class="label">对话线程</div><div class="value" id="threads">–</div></article>
      <article class="card"><div class="label">模型 / 推理</div><div class="value small" id="model">–</div></article>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>当前线程</h2><span id="thread-summary">尚未刷新</span></div>
      <div id="threads-wrap"><div class="empty">当前没有运行中的线程</div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>后台任务</h2><span id="updated">尚未刷新</span></div>
      <div id="table-wrap"><div class="empty">暂无任务</div></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const statusLabel = { queued: "排队中", running: "运行中", completed: "已完成", interrupted: "已中断", ready: "回传中", failed: "失败", cancelled: "已取消" };
    const phaseLabel = { queued: "排队", starting: "启动", thinking: "推理", planning: "规划", tool: "工具", editing: "修改文件", searching: "搜索", responding: "回复", working: "处理", delivering: "回传", completed: "完成", interrupted: "中断", cancelled: "取消" };

    function render(data) {
      const jobs = data.gateway.jobs || [];
      const counts = jobs.reduce((all, job) => (all[job.status] = (all[job.status] || 0) + 1, all), {});
      const online = data.livis.socketState === "open" && data.livis.relayReady;
      $("dot").className = `dot ${online ? "online" : data.livis.socketState === "open" ? "" : "offline"}`;
      $("connection-text").textContent = online ? "Livis 在线" : `Livis ${data.livis.socketState}`;
      $("agent").textContent = `Agent ${data.agentId} · 已运行 ${duration(data.now - data.startedAt)}`;
      $("running").textContent = (counts.running || 0) + (counts.queued || 0) + (counts.ready || 0);
      $("completed").textContent = counts.completed || 0;
      $("threads").textContent = data.gateway.threadCount || 0;
      $("model").textContent = `${data.codex.model} / ${data.codex.reasoningEffort}`;
      $("updated").textContent = `更新于 ${new Date(data.now).toLocaleTimeString("zh-CN", { hour12: false })}`;
      $("error").style.display = "none";
      renderThreads(data.gateway.threads || [], jobs, data.now);
      renderJobs(jobs);
    }

    function renderThreads(threads, jobs, now) {
      const wrap = $("threads-wrap");
      wrap.replaceChildren();
      const activeJobs = jobs.filter((job) => ["queued", "running", "ready"].includes(job.status));
      const activeIds = new Set(activeJobs.map((job) => job.threadId).filter(Boolean));
      const visible = threads.filter((thread) => thread.status === "active" || activeIds.has(thread.threadId));
      $("thread-summary").textContent = visible.length ? `${visible.length} 个活跃 · ${threads.length} 个已记录` : `${threads.length} 个已记录`;
      if (!visible.length && !activeJobs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "当前没有运行中的线程";
        wrap.append(empty);
        return;
      }
      const list = document.createElement("div");
      list.className = "threads-list";
      for (const job of activeJobs) {
        const thread = document.createElement("article");
        thread.className = "thread";
        const main = document.createElement("div");
        const title = document.createElement("div");
        title.className = "thread-title";
        title.append(status(job.status), document.createTextNode(` ${phaseLabel[job.phase] || job.phase || "处理中"}`));
        const input = document.createElement("div");
        input.className = "thread-input";
        input.textContent = job.inputPreview || "（未记录任务输入）";
        main.append(title, input);
        const meta = document.createElement("div");
        meta.className = "thread-meta";
        const activity = document.createElement("div");
        activity.className = "activity";
        activity.textContent = job.activity || "等待状态事件";
        const elapsed = job.startedAt ? now - job.startedAt : (job.receivedAt ? now - job.receivedAt : 0);
        meta.append(activity, document.createTextNode(`已用时 ${duration(elapsed)}\n任务 ${job.id}\n线程 ${job.threadId || "尚未创建"}`));
        thread.append(main, meta);
        list.append(thread);
      }
      wrap.append(list);
    }

    function renderJobs(jobs) {
      const wrap = $("table-wrap");
      wrap.replaceChildren();
      if (!jobs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "暂无任务";
        wrap.append(empty);
        return;
      }
      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>状态 / 阶段</th><th>任务 ID</th><th>任务输入</th><th>耗时</th><th>节点</th><th>更新时间</th><th>结果</th></tr></thead>";
      const body = document.createElement("tbody");
      for (const job of jobs.slice(0, 50)) {
        const row = document.createElement("tr");
        const state = document.createElement("div");
        state.append(status(job.status), document.createElement("br"), document.createTextNode(phaseLabel[job.phase] || job.phase || "–"));
        const elapsed = job.totalDurationMs || job.durationMs || (job.startedAt ? Date.now() - job.startedAt : 0);
        row.append(cell(state), cell(code(job.id)), cell(job.inputPreview || "–", "preview"), cell(elapsed ? duration(elapsed) : "–"), cell(code(job.nodeId || "–")), cell(job.updatedAt ? new Date(job.updatedAt).toLocaleString("zh-CN", { hour12: false }) : "–"), cell(job.resultPreview || "–", "preview"));
        body.append(row);
      }
      table.append(body);
      wrap.append(table);
    }

    function cell(content, className = "") { const td = document.createElement("td"); if (className) td.className = className; typeof content === "string" ? td.textContent = content : td.append(content); return td; }
    function code(text) { const node = document.createElement("code"); node.textContent = text; return node; }
    function status(value) { const node = document.createElement("span"); node.className = `status ${value}`; node.textContent = statusLabel[value] || value; return node; }
    function duration(ms) { const seconds = Math.max(0, Math.floor(ms / 1000)); if (seconds < 60) return `${seconds} 秒`; const minutes = Math.floor(seconds / 60); if (minutes < 60) return `${minutes} 分钟`; return `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分钟`; }

    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        $("error").textContent = `无法读取网关状态：${error.message}`;
        $("error").style.display = "block";
        $("dot").className = "dot offline";
        $("connection-text").textContent = "控制台离线";
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
